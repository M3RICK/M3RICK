<svg xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" font-family="'Fira Code','DejaVu Sans Mono',Consolas,monospace" font-size="14">
  <rect x="0" y="0" width="760" height="316" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- title bar -->
  <rect x="0" y="0" width="760" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="22" width="760" height="12" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" fill="#8b949e" text-anchor="middle" font-size="12">evtx_timeline — Windows Event Log forensic timeline</text>

  <g text-rendering="geometricPrecision">
    <!-- command -->
    <text x="22" y="66"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9" xml:space="preserve"> evtx_timeline samples/security.evtx</tspan></text>
    <text x="22" y="90"  fill="#8b949e">parsed 2261 events from 1 files</text>
    <text x="22" y="110" fill="#c9d1d9">found <tspan fill="#f0ad4e" font-weight="bold">13 alerts</tspan></text>

    <!-- alerts -->
    <text x="22" y="142" xml:space="preserve"><tspan fill="#e6a23c">[Warning] </tspan><tspan fill="#8b949e">2016-07-08 18:15:23  </tspan><tspan fill="#58a6ff">id=4720  </tspan><tspan fill="#c9d1d9">User account created       target=fsir</tspan></text>
    <text x="22" y="164" xml:space="preserve"><tspan fill="#58a6ff">[Info]    </tspan><tspan fill="#8b949e">2016-07-08 18:15:23  </tspan><tspan fill="#58a6ff">id=4722  </tspan><tspan fill="#c9d1d9">User account enabled       target=fsir</tspan></text>
    <text x="22" y="186" xml:space="preserve"><tspan fill="#e6a23c">[Warning] </tspan><tspan fill="#8b949e">2016-07-08 18:15:23  </tspan><tspan fill="#58a6ff">id=4724  </tspan><tspan fill="#c9d1d9">Password reset by another  target=fsir</tspan></text>
    <text x="22" y="208" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">[Critical]</tspan><tspan fill="#8b949e"> 2016-07-08 18:15:23  </tspan><tspan fill="#58a6ff">id=4732  </tspan><tspan fill="#ff9e9e">Added to PRIVILEGED group  target=Administrators</tspan></text>
    <text x="22" y="230" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">[Critical]</tspan><tspan fill="#8b949e"> 2016-07-09 22:25:47  </tspan><tspan fill="#58a6ff">id=4732  </tspan><tspan fill="#ff9e9e">Added to PRIVILEGED group  target=Administrators</tspan></text>
    <text x="22" y="252" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">[Critical]</tspan><tspan fill="#8b949e"> 2016-07-16 00:18:31  </tspan><tspan fill="#58a6ff">id=4732  </tspan><tspan fill="#ff9e9e">Added to PRIVILEGED group  target=Administrators</tspan></text>

    <text x="22" y="288" fill="#6e7681" font-size="12" font-style="italic">account created → enabled → password reset → escalated to local Administrators</text>
  </g>
</svg>
